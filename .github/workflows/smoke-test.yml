name: Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests

      - name: Run API smoke test
        id: smoke
        continue-on-error: true
        env:
          NUCLEARES_API_BASE: ${{ secrets.NUCLEARES_API_BASE }}
          NUCLEARES_COMMAND_TOKEN: ${{ secrets.NUCLEARES_COMMAND_TOKEN }}
        run: |
          set +e
          python tests/smoke_test.py
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Determine badge state
        if: ${{ always() }}
        id: badge
        run: |
          exit_code_raw="${{ steps.smoke.outputs.exit_code }}"
          exit_code="$(printf '%s' \"$exit_code_raw\" | tr -d '\r\n\"')"
          if [ -z "$exit_code" ]; then
            exit_code="1"
          fi
          echo "Resolved exit code: '$exit_code'"
          if [ "$exit_code" = "0" ]; then
            availability="online"
            availability_color="brightgreen"
            result="pass"
            result_color="brightgreen"
          elif [ "$exit_code" = "2" ]; then
            availability="offline"
            availability_color="lightgrey"
            result="fail"
            result_color="orange"
          else
            availability="error"
            availability_color="red"
            result="fail"
            result_color="red"
          fi
          echo "availability=$availability" >> "$GITHUB_OUTPUT"
          echo "availability_color=$availability_color" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "result_color=$result_color" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Build badge payload
        if: ${{ always() }}
        run: |
          mkdir -p badge
          cat <<EOF > badge/smoke-availability.json
          {
            "schemaVersion": 1,
            "label": "Smoke Availability",
            "message": "${{ steps.badge.outputs.availability }}",
            "color": "${{ steps.badge.outputs.availability_color }}",
            "cacheSeconds": 30
          }
          EOF
          cat <<EOF > badge/smoke-status.json
          {
            "schemaVersion": 1,
            "label": "Smoke Test",
            "message": "${{ steps.badge.outputs.result }}",
            "color": "${{ steps.badge.outputs.result_color }}",
            "cacheSeconds": 30
          }
          EOF

      - name: Generate badge SVGs
        if: ${{ always() }}
        run: |
          python -m pip install --quiet anybadge
          python - <<'PY'
    from pathlib import Path
    import json
    from anybadge import Badge, Level

    badge_dir = Path("badge")

    with (badge_dir / "smoke-availability.json").open("r", encoding="utf-8") as fh:
        availability = json.load(fh)

    availability_levels = {
        availability["message"]: availability["color"]
    }
    Badge(
        label=availability["label"],
        value=availability["message"],
        levels=availability_levels,
        default_color=availability["color"]
    ).write_badge(badge_dir / "smoke-availability.svg")

    with (badge_dir / "smoke-status.json").open("r", encoding="utf-8") as fh:
        status = json.load(fh)

    status_levels = {
        status["message"]: status["color"]
    }
    Badge(
        label=status["label"],
        value=status["message"],
        levels=status_levels,
        default_color=status["color"]
    ).write_badge(badge_dir / "smoke-status.svg")
PY

      - name: Debug badge outputs
        if: ${{ always() }}
        run: |
          echo "Badge availability: ${{ steps.badge.outputs.availability }}"
          echo "Badge result: ${{ steps.badge.outputs.result }}"
          echo "Badge exit code: ${{ steps.badge.outputs.exit_code }}"

      - name: Publish smoke test badge
        if: ${{ always() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: badge
          commit_message: "Update smoke test badge"

      - name: Fail job on smoke test errors
        if: ${{ steps.smoke.outcome == 'failure' }}
        run: |
          echo "Smoke test failed with exit code ${{ steps.badge.outputs.exit_code }}"
          exit 1
