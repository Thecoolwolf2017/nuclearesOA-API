name: Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "0 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests

      - name: Run API smoke test
        id: smoke
        continue-on-error: true
        env:
          NUCLEARES_API_BASE: ${{ secrets.NUCLEARES_API_BASE }}
          NUCLEARES_COMMAND_TOKEN: ${{ secrets.NUCLEARES_COMMAND_TOKEN }}
        run: |
          set +e
          python tests/smoke_test.py
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Determine badge state
        if: ${{ always() }}
        id: badge
        run: |
          exit_code="${{ steps.smoke.outputs.exit_code }}"
          if [ -z "$exit_code" ]; then
            exit_code="1"
          fi
          case "$exit_code" in
            0)
              message="online / pass"
              color="brightgreen"
              ;;
            2)
              message="offline / fail"
              color="lightgrey"
              ;;
            *)
              message="error / fail"
              color="red"
              ;;
          esac
          echo "message=$message" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Build badge payload
        if: ${{ always() }}
        run: |
          mkdir -p badge
          cat <<EOF > badge/smoke-test.json
          {
            "schemaVersion": 1,
            "label": "Smoke Test",
            "message": "${{ steps.badge.outputs.message }}",
            "color": "${{ steps.badge.outputs.color }}"
          }
          EOF

      - name: Publish smoke test badge
        if: ${{ always() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: badge
          commit_message: "Update smoke test badge"

      - name: Fail job on smoke test errors
        if: ${{ steps.badge.outputs.exit_code != '0' }}
        run: exit 1
